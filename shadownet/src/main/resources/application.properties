spring.datasource.url=jdbc:mysql://localhost:3306/shadownet
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

# AWS Configuration
aws.accessKeyId=YOUR_AWS_ACCESS_KEY_ID
aws.secretKey=YOUR_AWS_SECRET_KEY
aws.region=us-east-1
aws.s3.bucket-name=shadownet-ids-logs
aws.sns.topic-arn=arn:aws:sns:us-east-1:123456789012:shadownet-alerts

# Spring Profile (set to 'aws' to enable AWS services)
spring.profiles.active=default